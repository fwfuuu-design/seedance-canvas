<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seedance 画布</title>
<link rel="stylesheet" href="/app/style.css" />
</head>
<body>
<div id="app"></div>
<noscript>需要启用 JavaScript。</noscript>
<script type="module" src="/app/main.js"></script>
<script>
  // 直接双击打开 HTML 时没有本地服务，给出明确提示
  if (location.protocol === "file:") {
    document.getElementById("app").innerHTML =
      '<div style="color:#ddd;font:15px/1.7 -apple-system,sans-serif;padding:60px;max-width:560px">' +
      '<h2 style="font-weight:600">需要先启动本地服务</h2>' +
      '<p>在终端里进入 <code>seedance-studio</code> 文件夹，运行：</p>' +
      '<pre style="background:#222;padding:12px 16px;border-radius:8px">node server.mjs</pre>' +
      '<p>然后浏览器打开 <a style="color:#5aa8ff" href="http://127.0.0.1:8899">http://127.0.0.1:8899</a></p></div>';
  }
</script>
</body>
</html>
